name: PASEO GAME ZX - CI / Web & Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-web-build:
    name: Lint, Test & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Lint / Typecheck
        run: npm run lint

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paseo-game-zx-web-dist
          path: dist/
          retention-days: 14

  android-apk-build:
    name: Android Debug APK Build
    needs: test-and-web-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Verify APK Output and Size
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH")
            echo "SUCCESS: Found APK at $APK_PATH with size $APK_SIZE bytes"
            if [ "$APK_SIZE" -lt 100000 ]; then
              echo "ERROR: APK is suspiciously small (< 100KB), failing check."
              exit 1
            fi
          else
            echo "WARNING: APK not found in standard gradle output directory during CI environment check."
          fi

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PASEO-GAME-ZX-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
